name: Daily GridPilot Pipeline

on:
  schedule:
    - cron: "15 8 * * *"
      timezone: "America/Toronto"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run GridPilot pipeline
        run: |
          python scripts/03_run_pipeline.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw/PUB_Demand.csv
          git add data/processed/ontario_demand_2026.parquet

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update GridPilot demand data"
            git push
          fi